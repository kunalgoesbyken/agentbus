name: hunt-life
on:
  push:
    branches: [hunt-life]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: the test
        run: go test -tags integration -count=1 -timeout 15m -v -run TestRecoverAfterServiceEndsMidTurn ./cmd/agentbus
