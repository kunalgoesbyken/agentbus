name: hunt
on:
  push:
    branches: [hunt-apply]
jobs:
  hunt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./isolation -run TestHuntMatrix -v -count=1 2>&1 | grep -E "MISMATCH|apply:|checkpoint error|same|^(=== RUN|--- )" | grep -v "=== RUN" || true
