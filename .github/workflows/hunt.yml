name: hunt
on:
  push:
    branches: [hunt-apply]
jobs:
  hunt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./connector -run TestApplyKeepsAnEdit -v -count=1 2>&1 | tail -20 || true
