name: model

on:
  push:
    branches: [model-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: rename probe, as root for overlay
        run: sudo -E env "PATH=$PATH" go test ./isolation -run TestProbeRenameOverSameStat -count=1 -v 2>&1 | grep -v "^=== "
      - name: same size and time after a clone
        run: |
          git clone -q --depth 1 https://github.com/StaysUp/agentbus.git /tmp/r1
          git clone -q --depth 1 https://github.com/golang/go.git /tmp/r2; git clone -q --depth 1 https://github.com/vercel/next.js.git /tmp/r3
          for r in /tmp/r1 /tmp/r2 /tmp/r3; do PROBE_REPO=$r go test ./isolation -run TestProbeSameTick -count=1 -v 2>&1 | grep files; done
